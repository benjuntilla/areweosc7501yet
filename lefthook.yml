pre-commit:
  jobs:
    - name: format
      run: pnpm oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{js,ts,svelte}'
      run: pnpm oxlint {staged_files}
    - name: stylelint
      glob: 'src/**/*.{css,svelte}'
      run: pnpm stylelint --allow-empty-input --fix {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: format
      run: pnpm format:check
    - name: lint
      run: pnpm lint
    - name: check
      run: pnpm check
    - name: test
      run: pnpm test
    - name: schema
      run: pnpm schema && test -z "$(git status --porcelain -- schema/)"
    - name: tokens
      run: pnpm tokens && test -z "$(git status --porcelain -- src/styles/tokens.css)"
