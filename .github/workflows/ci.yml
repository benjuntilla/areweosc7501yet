name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Commits on a PR branch can be work in progress, since the PR title becomes the
      # squash commit, but none may carry AI attribution: no AI co-author or sign-off,
      # no "Generated with" marker and no session trailer.
      - uses: commit-check/commit-check-action@v2.18.2
        env:
          CCHK_CONVENTIONAL_COMMITS: false
          CCHK_SUBJECT_MIN_LENGTH: 1
          CCHK_SUBJECT_MAX_LENGTH: 200
          CCHK_AI_ATTRIBUTION: forbid
        with:
          message: true
          branch: false

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@v5.0.0

  verify:
    name: Lint, check, test and build
    runs-on: ubuntu-latest
    # Playwright's image has the browsers and the fonts that screenshots render with, and
    # `pnpm screenshots` renders in the same image. Keep its tag at the @playwright/test version.
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The postinstall hook in .config/mise.toml runs pnpm install, which uses the frozen lockfile in CI.
      - uses: jdx/mise-action@v5.2.3
      - run: node scripts/ci.ts
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots
          path: browser/screenshots
      - name: Build with cf
        run: pnpm cf build
      - name: Build Output exists
        run: |
          test -f .cloudflare/output/v0/config.json
          test -f .cloudflare/output/v0/workers/default/worker.config.json
          test -f .cloudflare/output/v0/workers/default/assets/index.html
          test -f .cloudflare/output/v0/workers/default/assets/data.json
