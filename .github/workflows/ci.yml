name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Policy in cchk.toml: any message is fine, but no AI attribution.
      - uses: commit-check/commit-check-action@v2.18.2
        with:
          message: true
          branch: false

  verify:
    name: Lint, check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pre-push jobs in lefthook.yml, run in parallel, each in its own log group.
      - name: Pre-push checks
        run: |
          names=() pids=()
          for job in $(pnpm -s lefthook dump --format json | jq -r '."pre-push".jobs[].name'); do
            pnpm -s lefthook run pre-push --force --no-tty --job "$job" > "$RUNNER_TEMP/$job.log" 2>&1 &
            names+=("$job") pids+=($!)
          done
          [ ${#pids[@]} -gt 0 ] || { echo '::error::lefthook.yml has no pre-push jobs'; exit 1; }
          failed=0
          for i in "${!pids[@]}"; do
            job=${names[$i]}
            if wait "${pids[$i]}"; then
              echo "::group::$job"; cat "$RUNNER_TEMP/$job.log"; echo '::endgroup::'
            else
              echo "::error title=$job::$job failed"; cat "$RUNNER_TEMP/$job.log"; failed=1
            fi
          done
          exit $failed
      - run: pnpm build
