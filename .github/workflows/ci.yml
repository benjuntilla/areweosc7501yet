name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Policy in cchk.toml: any message is fine, but no AI attribution.
      - uses: commit-check/commit-check-action@v2.18.2
        with:
          message: true
          branch: false

  verify:
    name: Lint, check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # mise.toml's postinstall hook runs pnpm install, which uses the frozen lockfile in CI.
      - uses: jdx/mise-action@v5.2.3
      - run: node scripts/ci.ts
      - name: Build with cf
        run: pnpm cf build
      - name: Build Output exists
        run: |
          test -f .cloudflare/output/v0/config.json
          test -f .cloudflare/output/v0/workers/default/worker.config.json
          test -f .cloudflare/output/v0/workers/default/assets/index.html
          test -f .cloudflare/output/v0/workers/default/assets/data.json
