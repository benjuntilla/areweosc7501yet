name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No AI attribution in any commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            if git log -1 --format=%B "$sha" | grep -qiE 'co-authored-by:.*(claude|anthropic)|claude-session|generated with claude'; then
              echo "::error::$sha carries a Claude attribution"
              status=1
            fi
          done
          exit $status

  verify:
    name: Lint, check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - name: JSON Schemas are up to date
        run: pnpm schema && git diff --exit-code schema/
      - name: Build with cf
        run: pnpm cf build
      - name: Build Output exists
        run: |
          test -f .cloudflare/output/v0/config.json
          test -f .cloudflare/output/v0/workers/default/worker.config.json
          test -f .cloudflare/output/v0/workers/default/assets/index.html
          test -f .cloudflare/output/v0/workers/default/assets/data.json
