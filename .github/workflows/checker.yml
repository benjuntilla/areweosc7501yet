name: Weekly check

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checker

jobs:
  check:
    name: Recheck entries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A GitHub App token, so CI and previews run on the PR it opens.
      - uses: actions/create-github-app-token@v3.3.0
        id: token
        with:
          client-id: ${{ vars.CHECKER_CLIENT_ID }}
          private-key: ${{ secrets.CHECKER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # create-pull-request takes its base from the checkout, so a manual run from another branch still targets main.
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      # The postinstall hook in .config/mise.toml runs pnpm install, which uses the frozen lockfile in CI.
      - uses: jdx/mise-action@v5.2.3
      - run: node scripts/checker/main.ts --body "$RUNNER_TEMP/body.md"
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
      - run: pnpm format data/entries data/checker.toml
      - uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ steps.token.outputs.token }}
          sign-commits: true
          add-paths: |
            data/entries
            data/checker.toml
          branch: checker/weekly
          delete-branch: true
          commit-message: 'chore(data): recheck entries upstream'
          title: 'chore(data): recheck entries upstream'
          body-path: ${{ runner.temp }}/body.md
