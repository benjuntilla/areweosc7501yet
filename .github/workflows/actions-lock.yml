name: Actions lockfile

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Actions lockfile
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # renovate: datasource=github-releases depName=github/gh-actions-lock
      GH_ACTIONS_LOCK_VERSION: v0.4.0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Fails when .github/workflows/actions.lock is stale or a pin no longer verifies upstream.
      - run: gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION"
      - run: gh actions-lock --verify
