name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - name: The title is the squash commit, so it must be a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [a-z0-9].*[^.]$'
          if ! [[ $TITLE =~ $pattern ]]; then
            echo "::error::\"$TITLE\" isn't a lowercase Conventional Commits header"
            exit 1
          fi
          if grep -qiE 'claude|anthropic|generated with' <<<"$TITLE"; then
            echo "::error::The title carries an AI attribution"
            exit 1
          fi
