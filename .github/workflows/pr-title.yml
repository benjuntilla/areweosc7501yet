name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      # The title becomes the squash commit on main, so it must be a Conventional Commit.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z0-9].*[^.]$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter or digit and not end with a period.
