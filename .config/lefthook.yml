pre-commit:
  jobs:
    - name: format
      run: pnpm format --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{js,ts,svelte}'
      run: pnpm oxlint --config .config/oxlint.config.ts {staged_files}
    - name: stylelint
      glob: 'src/**/*.{css,svelte}'
      run: pnpm stylelint --config .config/stylelint.config.ts --allow-empty-input --fix {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: format
      run: pnpm format:check
    - name: lint
      run: pnpm lint
    - name: check
      run: pnpm check
    - name: test
      run: pnpm test
    - name: knip
      run: pnpm knip
    - name: duplicates
      run: pnpm jscpd .
    - name: schema
      run: pnpm schema && test -z "$(git status --porcelain -- schema/)"
    - name: tokens
      run: pnpm tokens && test -z "$(git status --porcelain -- src/styles/tokens.css)"
    - name: typos
      run: mise exec -- typos
    - name: workflows
      run: mise exec -- actionlint && mise exec -- zizmor --quiet .github/workflows
    - name: site
      group:
        piped: true
        jobs:
          - name: build
            run: pnpm build && pnpm playwright install chromium
          - group:
              parallel: true
              jobs:
                - name: links
                  run: mise exec -- lychee --offline --no-progress --root-dir "$PWD/build" 'build/**/*.html'
                - name: html
                  run: pnpm html-validate build
                - name: size
                  run: pnpm size-limit
                - name: browser
                  run: pnpm playwright test
          - name: lighthouse
            run: CHROME_PATH="$(node -p "require('@playwright/test').chromium.executablePath()")" pnpm lhci autorun
